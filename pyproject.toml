[project]
name = "nisar-toolbox"
version = "0.1.0"
description = "A toolbox for searching, downloading, and accessing NISAR data."
authors = [
    {name = "SkyTruth"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "earthaccess>=0.19.0",
    "fsspec[http]>=2026.7.0",
    "geopandas>=1.2.0",
    "h5py>=3.16.0",
    "ipyleaflet>=0.20.0",
    "polars>=1.44.1",
    "pyreqwest>=0.12.4",
    "python-dotenv>=1.2.3",
    "rasterio>=1.5.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "ruff>=0.16.5",
]
